<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="rgba(124,58,237,0.1)"/>
  <circle cx="1100" cy="530" r="100" fill="rgba(217,70,239,0.1)"/>
  <circle cx="900" cy="150" r="60" fill="rgba(168,85,247,0.08)"/>
  
  <!-- Sparkle effects -->
  <circle cx="200" cy="200" r="3" fill="#a855f7"/>
  <circle cx="1000" cy="400" r="4" fill="#d946ef"/>
  <circle cx="400" cy="500" r="2" fill="#7c3aed"/>
  <circle cx="800" cy="100" r="3" fill="#a855f7"/>
  
  <!-- Main text -->
  <text x="600" y="260" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="white">Text Behind</text>
  <text x="600" y="360" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="url(#textGrad)">Image Online</text>
  
  <!-- Subtitle -->
  <text x="600" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.7)">100% Free • AI-Powered • No Sign-up Required</text>
  
  <!-- Logo icon -->
  <g transform="translate(550, 480)">
    <rect width="40" height="40" rx="8" fill="url(#textGrad)"/>
    <text x="10" y="28" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="white">T</text>
  </g>
  <text x="650" y="512" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="white">TextBehindImage.in</text>
</svg>
